<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turno Ya | Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #eef6ff, #f8fbff); }
        .login-card { max-width: 430px; border: 0; border-radius: 24px; box-shadow: 0 20px 60px rgba(24, 70, 110, .12); }
        .brand { color: #0d6efd; font-weight: 800; letter-spacing: -.5px; }
        .form-control { border-radius: 12px; padding: .8rem 1rem; }
        .btn-primary { border-radius: 12px; padding: .8rem; font-weight: 600; }
    </style>
</head>
<body>
<main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card login-card w-100 p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand fs-2">Turno Ya</div>
            <p class="text-secondary mb-0">Gestioná tus turnos de forma simple</p>
        </div>
        <form id="Datos">
            <div class="mb-3">
                <label for="usuario" class="form-label fw-semibold">Usuario</label>
                <input type="text" class="form-control" id="usuario" placeholder="Ingresá tu usuario" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            <p id="msj" class="text-center mt-3 mb-0"></p>
        </form>
    </div>
</main>
<script src="main.js"></script>
</body>
</html>
